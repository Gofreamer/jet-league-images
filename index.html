<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jet League Images</title>
  <style>
    body{margin:0;font-family:Inter,Arial,sans-serif;background:#0a0a0d;color:#f4f4f5;min-height:100vh;display:grid;place-items:center}
    main{width:min(760px,calc(100% - 32px));background:#111218;border:1px solid #292b34;border-radius:20px;padding:32px;box-shadow:0 20px 70px rgba(0,0,0,.35)}
    h1{margin:0 0 8px;font-size:2rem} p{color:#b8bac4;line-height:1.6} code{display:block;overflow:auto;padding:14px 16px;background:#08090c;border:1px solid #252731;border-radius:12px;color:#e7d58b}
    .tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#1c1e26;color:#ddd;font-size:.85rem;margin-bottom:18px}
  </style>
</head>
<body>
  <main>
    <span class="tag">JET LEAGUE • IMAGE HOST</span>
    <h1>Jet League Images</h1>
    <p>Repositório de imagens utilizado pelo TransferJet, Fantasy e Jet Cards.</p>
    <p>Depois de adicionar uma imagem ao repositório, use uma URL no formato:</p>
    <code>https://SEU-USUARIO.github.io/jet-league-images/images/agents/arquivo.webp</code>
  </main>
</body>
</html>
